services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_agent}
      POSTGRES_USER: ${POSTGRES_USER:-financial_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - financial-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-financial_agent}:${POSTGRES_PASSWORD:-financial_agent}@postgres:5432/${POSTGRES_DB:-financial_agent}?schema=public
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "${API_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  financial-agent-postgres:
